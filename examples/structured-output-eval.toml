schema_version = 2
name = "structured-output-eval"
pi_version = "latest"
thinking = "high"

[model]
id = "gpt-5.6-luna"
provider = "openai-codex"

[execution]
repetitions = 1
max_retries = 1

[tasks]
path = "evals/structured-output/tasks"
include = ["*"]
exclude = []

[evaluation]
type = "generated"
id = "structured-output"

[concurrency]
per_variant = 2

[control]
enabled = true
mode = "fresh"
history_scope = "hybrid"
minimum_runs_per_task = 4
maximum_age_days = 30
sentinel_tasks = 4
on_drift = "fresh"
on_inconclusive = "fresh"

# One [[variants]] block per arm. Skill under test goes here:
# [[variants]]
# id = "my-skill"
# [[variants.skills]]
# kind = "local"
# path = "~/my-skills/my-skill"  # must contain SKILL.md
