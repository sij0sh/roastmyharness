schema_version = 3
name = "local-extension"
pi_version = "latest"
thinking = "high"
model = "openai-codex/gpt-5.6-luna"

[tasks]
path = "~/datasets/my-tasks"
include = ["*"]
exclude = []

[concurrency]
per_variant = 2

[[variants]]
id = "my-ext"
name = "My extension"
agents_md = "~/my-extensions/my-extension/AGENTS.md"

[[variants.extensions]]
path = "~/my-extensions/my-extension"
entry = "src/index.ts"

[variants.env]
MY_EXTENSION_SETTING = "2"
