# Versioned model profiles for DeepSWE.
#
# A profile records what is MEASURED about running this benchmark under a
# model, so the wizard can recommend task sets and thinking levels from
# data instead of tribal knowledge. Fields stay null until measured: the
# wizard shows no rate it cannot cite. benchmark_rate here is the
# harness-published overall rate (mini-swe-agent, not pi runs); pi-agent
# rates land after calibration runs under pi.
#
# Cost tiers are deliberately absent: no per-task spend data exists yet.
# The tool records cost_usd per trial, so a calibration run can fill them.

profiles_version = 1
benchmark = "deepswe"
benchmark_revision = "2026-09"

[[profiles]]
id = "luna-high"
label = "GPT-5.6 Luna High"
provider = "openai-codex"
model = "gpt-5.6-luna"
thinking = "high"
benchmark_rate = 0.442
benchmark_samples = 452
benchmark_revision = "deepswe-published"
basis = "DeepSWE published rollouts under mini-swe-agent (200/452), cited in .pi-files/tasks.md. Pi-agent rate unmeasured."

[[profiles]]
id = "glm-flash-max"
label = "GLM-5.3-Flash Max"
provider = "z-ai-openai"
model = "glm-5.3-flash"
thinking = "max"
benchmark_rate = 0.634
benchmark_samples = 448
benchmark_revision = "deepswe-published"
basis = "DeepSWE published rollouts under mini-swe-agent (284/448), cited in .pi-files/tasks.md. Pi-agent rate unmeasured. Thinking follows the repo's GLM roast specs."

[[profiles]]
id = "muse-spark"
label = "Muse Spark 1.3"
basis = "No measured DeepSWE data yet; fill in after a calibration run. Never shown with a rate."

[[profiles]]
id = "sol"
label = "Sol Preview"
basis = "No measured DeepSWE data yet; fill in after a calibration run. Never shown with a rate."
