# Per-task label schema (all fields optional except the basis when
# labeled; unknown tasks read as unlabeled):
#
# [tasks.some-task-id]
# duration = "fast"        # fast|long, by historical median wall time
# difficulty = "medium"    # easy|medium|hard, by solve rate over the calibration set
# smoke = true             # deterministic smoke-probe candidate
# estimated_minutes = 8
# basis_revision = "deepswe-2026-09"
# basis_samples = 468
# basis_date = "2026-09-01"

[tasks]
# Difficulty bands the Luna High published solve rate: easy >= 3/4,
# medium = 2/4 (the prime paired-experiment band), hard <= 1/4.
# Calibration model is Luna High; GLM Flash rates on some of these
# tasks differ (see .pi-files/tasks.md) and do not move the label.
# Duration is unlabeled everywhere: no wall-time calibration exists yet.

[tasks.arcane-drift-detection-baselines]
difficulty = "easy"
basis_revision = "deepswe-published-mini-swe-agent"
basis_samples = 4
basis = "Luna High published 3/4, cited in .pi-files/tasks.md. Pi-agent rate unmeasured."

