# Benchmark catalog for DeepSWE.
#
# Task-level metadata lives HERE, never inside task directories:
# tasks/hashes.py hashes every file under each task dir, so editing
# a label inside a task dir would invalidate historic-control
# compatibility. Runs record catalog_hash separately from task_hash.
#
# Presets below are consolidated verbatim from suites.json (which the
# Pi wizard still reads; the wizard moves to this catalog in a later
# phase). Do not edit preset lists by hand to tune results; add a new
# preset with its basis noted instead.
#
# Per-task labels (duration/difficulty/smoke) land under [tasks] only
# WITH calibration data: every entry records its basis so labels never
# become tribal knowledge. No task is labeled yet.

catalog_version = 1
benchmark = "deepswe"
benchmark_revision = "2026-09"
source = "deepswe.datacurve.ai data/v1.1 per-task rollouts (mini-swe-agent); design notes in .pi-files/tasks.md"

