# Claude Code bare vs pi bare: pure harness comparison.
#
# Both arms run the SAME model (anthropic-gateway/claude-opus-5)
# at thinking "low", so the report compares harnesses at equal
# (task, model) with no model confound. The pi control gets the bare
# fairness contract (-nc --no-skills --no-prompt-templates --no-themes);
# the claude arm gets --strict-mcp-config plus a pinned settings.json
# (bypassPermissions, telemetry/auto-update off). No extensions or
# skills on either side.
#
# Smoke scale: one task via include. For the full 30-task signal
# screen, replace include with: include = ["*"]

schema_version = 2
name = "pi-vs-claude-bare"
thinking = "low"

[model]
id = "claude-opus-5"
provider = "anthropic-gateway"

[tasks]
path = "/home/joshsimon/Projects/RoastMyHarness/tasks/deepswe/tasks"
preset = "luna-signal"
include = ["boa-hierarchical-evaluation-cancellation"]
exclude = []

[concurrency]
per_variant = 1

[control]
enabled = true
mode = "fresh"

[[variants]]
id = "claude"
name = "Claude Code bare"
agent = "claude"
