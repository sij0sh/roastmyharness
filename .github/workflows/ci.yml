name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.12.4
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Check lint
        run: uv run ruff check .
      - name: Run tests and coverage gate
        run: uv run pytest --cov=roast_my_harness --cov-report=term-missing
      - name: Build wheel
        run: uv build --wheel

  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.4
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel into an empty env
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
      - name: Fail when the wheel drops bundled payload
        run: |
          /tmp/wheelcheck/bin/python - <<'EOF'
          from roast_my_harness import setup as setup_mod

          root = setup_mod.bundled_root()
          assert root is not None, "wheel has no bundled payload"
          for rel in (
              "integrations/pi/roastmyharness.ts",
              "integrations/pi/roastmyharness/core.ts",
              "tasks/deepswe/tasks/catalog.toml",
              "tasks/deepswe/tasks/profiles.toml",
          ):
              assert (root / rel).is_file(), f"missing from wheel: {rel}"
          assert setup_mod.bundled_tasks_root() is not None
          print(f"bundled payload ok at {root}")
          EOF
      - name: Setup from the bundled extension
        run: |
          export HOME=/tmp/wheelhome PATH=/tmp/wheelcheck/bin:$PATH
          mkdir -p /tmp/wheelwork && cd /tmp/wheelwork
          /tmp/wheelcheck/bin/roastmyharness setup --agent pi --scope user
      - name: Bundled discovery
        run: |
          export HOME=/tmp/wheelhome PATH=/tmp/wheelcheck/bin:$PATH
          cd /tmp/wheelwork
          /tmp/wheelcheck/bin/roastmyharness profiles
          /tmp/wheelcheck/bin/roastmyharness tool catalog | /tmp/wheelcheck/bin/python -c "import json,sys; d=json.load(sys.stdin); assert d['task_count'] > 100, d; print('catalog ok:', d['task_count'], 'tasks')"
      - name: Generated-eval discovery from the wheel
        run: |
          export HOME=/tmp/wheelhome PATH=/tmp/wheelcheck/bin:$PATH
          cd /tmp/wheelwork
          EVAL=$(/tmp/wheelcheck/bin/python -c "from roast_my_harness import setup as s; print(s.bundled_root() / 'examples/evals/structured-output/tasks')")
          /tmp/wheelcheck/bin/roastmyharness eval validate "$EVAL"
          /tmp/wheelcheck/bin/roastmyharness tool catalog --tasks "$EVAL" | /tmp/wheelcheck/bin/python -c "import json,sys; d=json.load(sys.stdin); assert d['eval']['id'] == 'structured-output', d; print('eval catalog ok:', d['eval']['id'], d['task_count'], 'tasks')"
      - name: Doctor executes without a checkout
        # No docker/auth in CI, so a nonzero exit is expected; the gate is
        # that doctor runs and prints the table from the wheel install.
        run: |
          export HOME=/tmp/wheelhome PATH=/tmp/wheelcheck/bin:$PATH
          cd /tmp/wheelwork
          /tmp/wheelcheck/bin/roastmyharness doctor || echo "doctor exit $? (no docker/auth in CI)"
