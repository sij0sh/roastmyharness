name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.12.4
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Check lint
        run: uv run ruff check .
      - name: Run tests and coverage gate
        run: uv run pytest --cov=roast_my_harness --cov-report=term-missing
      - name: Build wheel
        run: uv build --wheel
