# SoL-Pi (NVlabs/SoL-Pi) vs bare-pi control on the DeepSWE signal screen.
#
# Setup (once):
#   git clone https://github.com/NVlabs/SoL-Pi /home/joshsimon/Projects/SoL-Pi
#   npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.84.2
#
# SoL-Pi config (conservative: local-only mechanisms, no extra model calls):
#   {"version": 1, "actionFusion": true, "observationPack": true,
#    "evidencePreservingReducer": false, "onlineContextCompact": false,
#    "cacheWriteReadRatio": 12.5}
#   Place it as sol-pi.json in the staged agent dir (in-container:
#   $PI_CODING_AGENT_DIR/sol-pi.json; official Pi default: ~/.pi/agent/sol-pi.json).
#   The harness stages no sol-pi.json yet, so confirm the file lands in the
#   staged home before launching. Validate it from the checkout with:
#   node /home/joshsimon/Projects/SoL-Pi/scripts/check-sol-pi-config.mjs \
#     --config <path-to-sol-pi.json>
#   Enable the other two mechanisms only after reviewing their implications.
#
# Smoke scale: 3 tasks x 1 repetition each (6 trials total with control).
# For the full 30-task signal screen, set include = ["*"].
#
#   roastmyharness validate sol-pi.toml
#   roastmyharness run sol-pi.toml

schema_version = 2
name = "sol-pi"
pi_version = "0.84.2"
thinking = "high"
hypothesis = "pi + SoL-Pi (actionFusion, observationPack) resolves more DeepSWE signal tasks than bare pi"

[model]
id = "gpt-5.6-luna"
provider = "azure-gateway-responses"

[execution]
repetitions = 1
max_retries = 1

[tasks]
path = "/home/joshsimon/Projects/RoastMyHarness/tasks/deepswe/tasks"
preset = "luna-signal"
include = [
  "boa-hierarchical-evaluation-cancellation",
  "bandit-incremental-cache-control",
  "httpx-deterministic-cookie-store",
]
exclude = []

[concurrency]
per_variant = 2

[control]
enabled = true
mode = "fresh"

[[variants]]
id = "sol-pi"
name = "pi + SoL-Pi"

[[variants.extensions]]
kind = "local"
path = "/home/joshsimon/Projects/SoL-Pi"
entry = "src/sol-pi/index.ts"
name = "sol-pi"
